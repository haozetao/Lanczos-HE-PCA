<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#7F7F7F"/>
  </marker>
</defs>
<rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

<text x="960" y="48" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#002060">
<tspan x="960" dy="0">Nudge: A Private Recommendations Engine</tspan>
</text>
<text x="960" y="78" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#7F7F7F">
<tspan x="960" dy="0">Three-party secure matrix factorization via power iteration · Henzinger et al.</tspan>
</text>
<rect x="420" y="94" width="185" height="30" rx="15.0" ry="15.0" fill="#FFFFFF" stroke="#548235" stroke-width="2"/>
<text x="512.5" y="113.0" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#548235">
<tspan x="512.5" dy="0">Users</tspan>
</text>
<rect x="640" y="94" width="185" height="30" rx="15.0" ry="15.0" fill="#FFFFFF" stroke="#002060" stroke-width="2"/>
<text x="732.5" y="113.0" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#002060">
<tspan x="732.5" dy="0">Servers</tspan>
</text>
<rect x="860" y="94" width="185" height="30" rx="15.0" ry="15.0" fill="#FFFFFF" stroke="#C00000" stroke-width="2"/>
<text x="952.5" y="113.0" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#C00000">
<tspan x="952.5" dy="0">3PC ApproxFactor</tspan>
</text>
<rect x="1080" y="94" width="185" height="30" rx="15.0" ry="15.0" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="2"/>
<text x="1172.5" y="113.0" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#7F7F7F">
<tspan x="1172.5" dy="0">Primitives</tspan>
</text>
<rect x="1300" y="94" width="185" height="30" rx="15.0" ry="15.0" fill="#FFFFFF" stroke="#ED7D31" stroke-width="2"/>
<text x="1392.5" y="113.0" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ED7D31">
<tspan x="1392.5" dy="0">Recommendations</tspan>
</text>
<rect x="50" y="165" width="1820" height="170" rx="18" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.5"/>
<text x="74" y="195" text-anchor="start" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#002060">
<tspan x="74" dy="0">1. Private Data Collection  私有数据收集</tspan>
</text>
<rect x="50" y="360" width="1820" height="390" rx="18" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.5"/>
<text x="74" y="390" text-anchor="start" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#C00000">
<tspan x="74" dy="0">2. Private Matrix Factorization  私有矩阵分解</tspan>
</text>
<rect x="50" y="775" width="1820" height="150" rx="18" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1.5"/>
<text x="74" y="805" text-anchor="start" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ED7D31">
<tspan x="74" dy="0">3. Private Recommendation Serving  隐私推荐分发</tspan>
</text>
<rect x="115" y="215" width="250" height="85" rx="14" ry="14" fill="#FFFFFF" stroke="#548235" stroke-width="2"/>
<text x="240.0" y="243" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#548235">
<tspan x="240.0" dy="0">Users</tspan>
</text>
<text x="240.0" y="273" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">
<tspan x="240.0" dy="0">每个用户本地持有评分向量</tspan>
<tspan x="240.0" dy="16">u^(i) ∈ R^n；原始评分不外流</tspan>
</text>
<rect x="455" y="215" width="250" height="85" rx="14" ry="14" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="2"/>
<text x="580.0" y="243" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7F7F7F">
<tspan x="580.0" dy="0">Secret-share input</tspan>
</text>
<text x="580.0" y="273" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">
<tspan x="580.0" dy="0">Replicated Secret Sharing</tspan>
<tspan x="580.0" dy="15">u^(i) -&gt; ⟦u^(i)⟧_1, ⟦u^(i)⟧_2, ⟦u^(i)⟧_3</tspan>
</text>
<rect x="820" y="200" width="520" height="112" rx="16" fill="#F4F7FB" stroke="#002060" stroke-width="2"/>
<text x="1080" y="228" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#002060">
<tspan x="1080" dy="0">Three non-colluding servers</tspan>
</text>
<rect x="855" y="245" width="130" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#002060" stroke-width="2"/>
<text x="920.0" y="273" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#002060">
<tspan x="920.0" dy="0">Server 1</tspan>
</text>
<text x="920.0" y="303" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#333333">
<tspan x="920.0" dy="0">holds ⟦U⟧_1</tspan>
</text>
<rect x="1015" y="245" width="130" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#002060" stroke-width="2"/>
<text x="1080.0" y="273" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#002060">
<tspan x="1080.0" dy="0">Server 2</tspan>
</text>
<text x="1080.0" y="303" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#333333">
<tspan x="1080.0" dy="0">holds ⟦U⟧_2</tspan>
</text>
<rect x="1175" y="245" width="130" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#002060" stroke-width="2"/>
<text x="1240.0" y="273" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#002060">
<tspan x="1240.0" dy="0">Server 3</tspan>
</text>
<text x="1240.0" y="303" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#333333">
<tspan x="1240.0" dy="0">holds ⟦U⟧_3</tspan>
</text>
<rect x="1465" y="218" width="300" height="78" rx="14" ry="14" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="2"/>
<text x="1615.0" y="246" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7F7F7F">
<tspan x="1615.0" dy="0">Input Validation</tspan>
</text>
<text x="1615.0" y="276" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">
<tspan x="1615.0" dy="0">可选：一次性合法性校验</tspan>
<tspan x="1615.0" dy="15">轻量开销</tspan>
</text>
<line x1="365" y1="257" x2="455" y2="257" stroke="#548235" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<line x1="705" y1="244" x2="820" y2="244" stroke="#002060" stroke-width="2.2" marker-end="url(#arrow)" fill="none"/>
<line x1="705" y1="257" x2="820" y2="257" stroke="#002060" stroke-width="2.2" marker-end="url(#arrow)" fill="none"/>
<line x1="705" y1="270" x2="820" y2="270" stroke="#002060" stroke-width="2.2" marker-end="url(#arrow)" fill="none"/>
<rect x="215" y="405" width="1080" height="300" rx="18" fill="#FFFFFF" stroke="#C00000" stroke-width="3"/>
<text x="755.0" y="437" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#C00000">
<tspan x="755.0" dy="0">Three-Party Power Iteration / ApproxFactor</tspan>
</text>
<text x="755.0" y="463" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#666666">
<tspan x="755.0" dy="0">核心只保留算法主链：初始化 -&gt; 幂迭代 -&gt; 输出 B 与 ⟦A⟧</tspan>
</text>
<rect x="250" y="493" width="230" height="88" rx="14" ry="14" fill="#FFFFFF" stroke="#C00000" stroke-width="2"/>
<text x="365.0" y="521" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#C00000">
<tspan x="365.0" dy="0">2.1 初始化</tspan>
</text>
<text x="365.0" y="551" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">
<tspan x="365.0" dy="0">for i=1..d</tspan>
<tspan x="365.0" dy="15">随机 ⟦v⟧；正交化并归一化</tspan>
<tspan x="365.0" dy="15">B 初始为 0</tspan>
</text>
<rect x="525" y="488" width="430" height="150" rx="14" fill="#FFFDFD" stroke="#C00000" stroke-width="2.5" stroke-dasharray="10 7"/>
<text x="740.0" y="518" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#C00000">
<tspan x="740.0" dy="0">2.2 幂迭代主循环（ℓ rounds）</tspan>
</text>
<text x="740.0" y="554" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#333333">
<tspan x="740.0" dy="0">⟦v⟧ &lt;- U^T (U ⟦v⟧)</tspan>
<tspan x="740.0" dy="18">⟦v⟧ &lt;- SetOrthogonal(⟦v⟧, B)</tspan>
<tspan x="740.0" dy="18">⟦v⟧ &lt;- Normalize(⟦v⟧)</tspan>
</text>
<text x="740.0" y="620" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#7F7F7F">
<tspan x="740.0" dy="0">linear mul: non-interactive；nonlinear: 3PC/FSS</tspan>
</text>
<rect x="1000" y="493" width="230" height="88" rx="14" ry="14" fill="#FFFFFF" stroke="#C00000" stroke-width="2"/>
<text x="1115.0" y="521" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#C00000">
<tspan x="1115.0" dy="0">2.3 输出模型</tspan>
</text>
<text x="1115.0" y="551" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">
<tspan x="1115.0" dy="0">B_i := 收敛后的 v</tspan>
<tspan x="1115.0" dy="15">B ∈ R^(d×n)</tspan>
<tspan x="1115.0" dy="15">公开模型</tspan>
</text>
<rect x="1000" y="600" width="230" height="70" rx="14" ry="14" fill="#FFFFFF" stroke="#C00000" stroke-width="2"/>
<text x="1115.0" y="628" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#C00000">
<tspan x="1115.0" dy="0">2.4 用户嵌入</tspan>
</text>
<text x="1115.0" y="658" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">
<tspan x="1115.0" dy="0">⟦A⟧ := ⟦U⟧ · B^T</tspan>
<tspan x="1115.0" dy="15">仍为秘密共享</tspan>
</text>
<line x1="480" y1="537" x2="525" y2="537" stroke="#C00000" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<line x1="955" y1="537" x2="1000" y2="537" stroke="#C00000" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<line x1="1115" y1="581" x2="1115" y2="600" stroke="#C00000" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<polyline points="740,628 740,654 560,654 560,538" stroke="#C00000" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#arrow)" fill="none"/>
<text x="250" y="681" text-anchor="start" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#C00000">
<tspan x="250" dy="0">Goal: argmin ||U - A·B||_F；等价于求 U^T U 的 top-d 特征向量</tspan>
</text>
<rect x="1360" y="415" width="440" height="135" rx="14" ry="14" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="2"/>
<text x="1580.0" y="443" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7F7F7F">
<tspan x="1580.0" dy="0">Cryptographic primitives</tspan>
</text>
<text x="1580.0" y="473" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">
<tspan x="1580.0" dy="0">Replicated Secret Sharing；Function Secret Sharing</tspan>
<tspan x="1580.0" dy="16">Truncation；Approx. Normalize</tspan>
<tspan x="1580.0" dy="16">用于支撑阶段 2 的线性乘法与非线性函数</tspan>
</text>
<rect x="1360" y="580" width="440" height="100" rx="14" ry="14" fill="#FFFFFF" stroke="#002060" stroke-width="2"/>
<text x="1580.0" y="608" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#002060">
<tspan x="1580.0" dy="0">Security model</tspan>
</text>
<text x="1580.0" y="638" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#333333">
<tspan x="1580.0" dy="0">honest-but-curious；3-party honest majority</tspan>
<tspan x="1580.0" dy="15">保护 1 台服务器被 compromise 时的用户隐私</tspan>
<tspan x="1580.0" dy="15">限制：不防 malicious / 2 台合谋 / metadata 泄漏</tspan>
</text>
<line x1="1080" y1="312" x2="1080" y2="405" stroke="#C00000" stroke-width="5" marker-end="url(#arrow)" fill="none"/>
<rect x="270" y="825" width="320" height="72" rx="14" ry="14" fill="#FFFFFF" stroke="#002060" stroke-width="2"/>
<text x="430.0" y="853" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#002060">
<tspan x="430.0" dy="0">Server-side scoring</tspan>
</text>
<text x="430.0" y="883" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">
<tspan x="430.0" dy="0">三方计算 ⟦scores⟧ = ⟦a^(i)⟧ · B</tspan>
</text>
<rect x="800" y="825" width="320" height="72" rx="14" ry="14" fill="#FFFFFF" stroke="#ED7D31" stroke-width="2"/>
<text x="960.0" y="853" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ED7D31">
<tspan x="960.0" dy="0">Return shares</tspan>
</text>
<text x="960.0" y="883" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">
<tspan x="960.0" dy="0">服务器分别发送 scores 的秘密份额</tspan>
</text>
<rect x="1330" y="825" width="320" height="72" rx="14" ry="14" fill="#FFFFFF" stroke="#548235" stroke-width="2"/>
<text x="1490.0" y="853" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#548235">
<tspan x="1490.0" dy="0">User-side reconstruction</tspan>
</text>
<text x="1490.0" y="883" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333333">
<tspan x="1490.0" dy="0">User i 本地重构并选择 Top-k item</tspan>
</text>
<line x1="590" y1="861" x2="800" y2="861" stroke="#ED7D31" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<line x1="1120" y1="861" x2="1330" y2="861" stroke="#ED7D31" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<rect x="50" y="955" width="1820" height="78" rx="14" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="1.5"/>
<text x="960" y="987" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#002060">
<tspan x="960" dy="0">实验结论：Netflix 50 min / 40 GB / nDCG@20=0.29；Criteo 1.5 h / 124 GB；Yelp 8 h / 250 GB；相较 2PC 乱码电路快 4 个数量级，相较 4PC 通信少 8×</tspan>
</text>
<text x="960" y="1020" text-anchor="middle" font-family="Arial, PingFang SC, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#7F7F7F">
<tspan x="960" dy="0">Source: Henzinger, Dauterman, Corrigan-Gibbs, Boneh. Nudge: A Private Recommendations Engine.</tspan>
</text>
</svg>